name: Weekly Report
on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 UTC 00:00 (KST 09:00)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python analysis/report.py
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/reports
          git commit -m "chore: weekly report" || echo "no changes"
          git push
